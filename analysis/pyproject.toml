[project]
name = "kinetic-analysis"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["demucs>=4.0.1", "librosa>=0.10", "numpy", "scipy", "soundfile", "torch==2.8.0", "torchaudio==2.8.0"]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
